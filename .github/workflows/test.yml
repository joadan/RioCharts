name: Test

# Runs every test on Linux, on .NET 10 and .NET 11 (the test projects target both), for each push to master and each pull request
# against it (forks too), so the visual snapshots (tests/RioCharts.Tests/Snapshots) are checked on the same OS as the release workflow.
# Pull requests use `pull_request`, never `pull_request_target`: code from a fork runs with a read-only token and no secrets.
# On a snapshot failure, the received SVGs are uploaded as an artifact to compare.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs the history

      - uses: actions/setup-dotnet@v6
        with:
          # The packages target .NET 10 (LTS) and .NET 11: restoring them needs both SDKs.
          dotnet-version: |
            10.0.x
            11.0.x

      # The bUnit tests fake the JS module, so a syntax error in it would pass them: check it here.
      - name: Check the JS module's syntax
        run: |
          cp src/RioCharts.Blazor/RioChart.razor.js "$RUNNER_TEMP/RioChart.razor.mjs"
          node --check "$RUNNER_TEMP/RioChart.razor.mjs"

      - name: Test
        run: |
          dotnet test tests/RioCharts.Tests/RioCharts.Tests.csproj -c Release
          dotnet test tests/RioCharts.Blazor.Tests/RioCharts.Blazor.Tests.csproj -c Release

      - name: Upload changed snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-snapshots
          path: tests/RioCharts.Tests/Snapshots/*.received.svg
          if-no-files-found: ignore
