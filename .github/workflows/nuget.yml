# Packs RioCharts.Core, .Blazor, .Skia, .AI and .Mcp and publishes them to nuget.org.
#
# Release: push a tag named v<version>, e.g.
#   git tag v0.1.0-preview.1 && git push origin v0.1.0-preview.1
# The package version is the tag without the leading "v".
#
# Publishing uses nuget.org Trusted Publishing (no API key stored in GitHub). One-time setup:
#   1. nuget.org → your account → Trusted Publishing → add a policy:
#      repository owner "joadan", repository "RioCharts", workflow file "nuget.yml".
#   2. GitHub → Settings → Secrets and variables → Actions → add secret NUGET_USER
#      with your nuget.org user name (the profile name, not the email).
# Run it by hand (workflow_dispatch) to only pack and test; packages are then uploaded as an
# artifact but not published.
name: NuGet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for nuget.org Trusted Publishing

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test tests/RioCharts.Tests/RioCharts.Tests.csproj -c Release

      - name: Pack
        run: |
          for p in Core Blazor Skia AI Mcp; do
            dotnet pack "src/RioCharts.$p/RioCharts.$p.csproj" -c Release -o packages ${{ steps.version.outputs.args }}
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages

      - name: NuGet login (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
