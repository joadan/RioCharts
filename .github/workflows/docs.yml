# Builds the Blazor WebAssembly docs site (samples/RioCharts.Docs) and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Docs site

on:
  push:
    branches: [master]
    paths:
      - "src/RioCharts.Core/**"
      - "src/RioCharts.Blazor/**"
      - "samples/RioCharts.Docs/**"
      - "Directory.Build.props"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs the full history for the version height

      - uses: actions/setup-dotnet@v6
        with:
          # The packages target .NET 10 (LTS) and .NET 11: restoring them needs both SDKs.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Publish
        run: dotnet publish samples/RioCharts.Docs/RioCharts.Docs.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          # The site is at the root of https://riocharts.com (custom domain in the repo's Pages
          # settings), so <base href="/"> stays as it is.
          # Link previews (Teams, Slack...) cache the image by its URL: add the card's hash, so a new
          # card gets a new URL and shows at once.
          card=$(sha256sum publish/wwwroot/social-card.png | cut -c1-8)
          sed -i "s|social-card.png\"|social-card.png?v=$card\"|g" publish/wwwroot/index.html
          # Every page gets its own copy of index.html (/pies is served from pies.html), so direct
          # links and search engines get status 200, not 404. The routes are the docs' @page
          # directives, so a new page is included without changing this.
          for route in $(grep -ho '@page "/[a-z0-9-]\+"' samples/RioCharts.Docs/Pages/*.razor | sed 's|@page "/||; s|"||' | grep -vx 'not-found'); do
            cp publish/wwwroot/index.html "publish/wwwroot/$route.html"
          done
          # Anything else (an old or mistyped link) is served by 404.html: the app shows its not-found page.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Serve _framework and _content as they are.
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
