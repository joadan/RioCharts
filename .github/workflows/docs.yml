# Builds the Blazor WebAssembly docs site (samples/RioCharts.Docs) and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Docs site

on:
  push:
    branches: [master]
    paths:
      - "src/RioCharts.Core/**"
      - "src/RioCharts.Blazor/**"
      - "samples/RioCharts.Docs/**"
      - "Directory.Build.props"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish samples/RioCharts.Docs/RioCharts.Docs.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          # The site lives under /<repository>/, not at the root.
          base="/${{ github.event.repository.name }}/"
          sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" publish/wwwroot/index.html
          # Deep links (e.g. /RioCharts/pies) are served by 404.html: let the app route them.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Serve _framework and _content as they are.
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
