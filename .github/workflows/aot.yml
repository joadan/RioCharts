name: Native AOT

# Publishes tests/RioCharts.AotSmoke with native AOT (trimmed, no JIT) and runs it: JSON definitions,
# binding, layout, texts, SVG/PNG export and the AI tool. The publish fails on any trimming or
# AOT warning, and the run fails when a check does. Runs on master and on pull requests (forks too, with
# `pull_request`: read-only token, no secrets) that touch the libraries.
on:
  push:
    branches: [master]
    paths: ['src/**', 'tests/RioCharts.AotSmoke/**', '.github/workflows/aot.yml']
  pull_request:
    branches: [master]
    paths: ['src/**', 'tests/RioCharts.AotSmoke/**', '.github/workflows/aot.yml']
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs the history

      - uses: actions/setup-dotnet@v6
        with:
          # The packages target .NET 10 (LTS) and .NET 11: restoring them needs both SDKs.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish with native AOT and run, on .NET 10 and .NET 11
        run: |
          for f in net10.0 net11.0; do
            dotnet publish tests/RioCharts.AotSmoke/RioCharts.AotSmoke.csproj -c Release -f $f -r linux-x64 -o aot-$f
            ./aot-$f/RioCharts.AotSmoke
          done
